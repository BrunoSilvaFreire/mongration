[behave]
show_skipped = false
show_timings = true
stop = false

# Logging configuration
logging_level = INFO
logging_format = %(levelname)-8s %(name)s: %(message)s
logging_filter = -urllib3
capture = no
capture_stderr = yes

# Tags configuration
tags = ~@wip

# Test output
# JUnit XML reports
junit = true
junit_directory = tests/reports

# Console output
format = pretty
color = true

# Test paths
paths = features

# Note: To generate a human-readable text report alongside console output:
# Run from project root: 
#   behave tests/features -f pretty -f plain -o tests/tests/reports/behave-report.txt
# This will show pretty output in console AND save plain text to the file