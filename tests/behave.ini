[behave]
format = pretty
color = true
show_skipped = false
show_timings = true
stop = false

# Logging configuration
logging_level = INFO
logging_format = %(levelname)-8s %(name)s: %(message)s
logging_filter = -urllib3
capture = no
capture_stderr = yes

# Tags configuration
tags = ~@wip

# Test output
junit = true
junit_directory = tests/reports

# Test paths
paths = features