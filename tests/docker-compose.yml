version: '3.8'

services:
  mongodb-test:
    image: mongo:7.0
    container_name: mongrations-test-db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: testuser
      MONGO_INITDB_ROOT_PASSWORD: testpass
      MONGO_INITDB_DATABASE: mongrations_test
    volumes:
      - mongodb_test_data:/data/db
    networks:
      - mongrations-test-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongodb_test_data:

networks:
  mongrations-test-network:
    driver: bridge