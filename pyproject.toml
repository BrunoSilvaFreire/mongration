[tool.poetry]
name = "mongrations"
version = "0.1.0"
description = "MongoDB migrations"
authors = ["Bruno Silva Freire <brunorbsf@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.8"
tqdm = "~4.66.2"
motor = "~3.3.2"
pymongo = "~4.6.2"

[tool.poetry.group.dev.dependencies]
behave = "^1.2.6"
pytest = "^7.0.0"
debugpy = "^1.8.0"

[tool.poetry.scripts]
mongrate = "mongrations.main:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
